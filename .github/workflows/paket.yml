# Baut das Programm Rohrlaser-Angebotskalkulation.exe mit STEP-Import.exe (Windows, ohne Installation
# lauffähig), prüft STEP-Import.exe gegen die Python-Messung und die fertige .exe mit dem Selbsttest und
# packt alles zu Rohrlaser-Angebotskalkulation.zip. Auf main wird das Paket als Release "aktuell" veröffentlicht,
# dazu für das Online-Update die Dateiliste Update.json und die Pakete im Release "update-dateien" des öffentlichen
# Repositorys Rohrlaser-Updates (nur neue Pakete werden hochgeladen, das Programm lädt nur Pakete mit geänderten Dateien).
# Aus demselben Programmordner entsteht Rohrlaser-Angebotskalkulation-Setup.exe (Inno Setup, Installation nur für den
# Benutzer); das ZIP unterscheidet sich nur durch Portabel.ini (Daten neben dem Programm statt im Benutzerprofil).
#
# Actions-Minuten sparen: Pull Requests und Pushes auf main prüfen nur unter Linux (Tests, Anleitung bei PRs).
# Der Windows-Build mit Release und Online-Update läuft nur, wenn der Workflow von Hand gestartet wird
# (Actions > Paket > Run workflow, Zweig main) – einmal nach mehreren zusammen gemergten Pull Requests.
# Von einem anderen Zweig gestartet, baut und prüft er das Paket nur, ohne zu veröffentlichen.
name: Paket

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # volle Historie für die Prüfung „Anleitung angepasst?“
      - name: Programm geändert, Anleitung auch? (sonst Begründung in einer Commit-Nachricht)
        if: github.event_name == 'pull_request'
        run: python3 tests/pruefe_anleitung_geaendert.py "origin/${{ github.base_ref }}"
      - name: Python-Pakete
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pip libegl1 libxkbcommon0
          /usr/bin/python3 -m pip install --break-system-packages -r requirements.txt -r programm/requirements.txt
      - name: STEP-Messung und Optimierung
        run: |
          /usr/bin/python3 tests/test_step_import.py
          /usr/bin/python3 tests/test_step_regression.py
          /usr/bin/python3 tests/test_step_einlesen.py
          QT_QPA_PLATFORM=offscreen /usr/bin/python3 tests/test_step_profile.py
          /usr/bin/python3 tests/test_step_konturen.py
          QT_QPA_PLATFORM=offscreen /usr/bin/python3 tests/test_step_ergebnis.py
          /usr/bin/python3 tests/test_optimierung.py
          /usr/bin/python3 tests/test_lieferlaengen.py
      - name: STEP-Referenztests mit Testbericht
        run: /usr/bin/python3 tests/test_step_referenz.py --bericht STEP-Testbericht.json --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        continue-on-error: true      # volles Artefakt-Kontingent darf den Build nicht scheitern lassen
        if: always()
        with:
          name: STEP-Testbericht
          path: STEP-Testbericht.json
          retention-days: 90
      - name: Programm-Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /usr/bin/python3 tests/test_programm.py
          /usr/bin/python3 tests/test_konturklassen.py
          /usr/bin/python3 tests/test_zusatzarbeiten.py
          /usr/bin/python3 tests/test_zusatz_verwaltung.py
          /usr/bin/python3 tests/test_zukauf.py
          /usr/bin/python3 tests/test_zukauf_verwaltung.py
          /usr/bin/python3 tests/test_zukauf_angebot.py
          /usr/bin/python3 tests/test_zukauf_preise.py
          /usr/bin/python3 tests/test_kunden_csv.py
          /usr/bin/python3 tests/test_zukauf_schnell.py
          /usr/bin/python3 tests/test_zukauf_ek.py
          /usr/bin/python3 tests/test_zukauf_blech.py
          /usr/bin/python3 tests/test_blech_position.py
          /usr/bin/python3 tests/test_step_satz.py
          /usr/bin/python3 tests/test_bohrbild.py
          /usr/bin/python3 tests/test_doppelklick.py
          /usr/bin/python3 tests/test_step_bleche.py
          /usr/bin/python3 tests/test_werkstoffe.py
          /usr/bin/python3 tests/test_meterpreis.py
          /usr/bin/python3 tests/test_maschinen.py
          /usr/bin/python3 tests/test_offene_profile.py
          /usr/bin/python3 tests/test_wand_einstiche.py
          /usr/bin/python3 tests/test_ansicht.py
          /usr/bin/python3 tests/test_spaltenbreite.py
          /usr/bin/python3 tests/test_zeiten.py
          /usr/bin/python3 tests/test_staffelpreise.py
          /usr/bin/python3 tests/test_update.py
          /usr/bin/python3 tests/test_fracht.py
          /usr/bin/python3 tests/test_fracht_angebot.py
          /usr/bin/python3 tests/test_fracht_auto.py
          /usr/bin/python3 tests/test_fracht_richtwerte.py
          /usr/bin/python3 tests/test_sicherung.py
          /usr/bin/python3 tests/test_preisbasis.py
          /usr/bin/python3 tests/test_rundung.py
          /usr/bin/python3 tests/test_angebot_vorgaben.py
          /usr/bin/python3 tests/test_angebot_einstellungen.py
          /usr/bin/python3 tests/test_kundenmaterial.py
          /usr/bin/python3 tests/test_schneidweg.py
          /usr/bin/python3 tests/test_naht.py
          /usr/bin/python3 tests/test_gehrung.py
          /usr/bin/python3 tests/test_tastatur.py
          /usr/bin/python3 tests/test_materialanfrage.py
          /usr/bin/python3 tests/test_anleitung.py
      - name: Abnahme (realistische Testangebote und Abnahmekriterien)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /usr/bin/python3 tests/test_abnahme.py --protokoll Abnahmeprotokoll.md
          cat Abnahmeprotokoll.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        continue-on-error: true      # volles Artefakt-Kontingent darf den Build nicht scheitern lassen
        with:
          name: Abnahmeprotokoll
          path: Abnahmeprotokoll.md
          retention-days: 90

  # Die Bedienungsanleitung entsteht nur hier, aus dem aktuellen Programm (Bildschirmfotos) und
  # anleitung/erzeuge_anleitung.py; sie liegt nicht im Repository. Das Windows-Paket nimmt genau diese PDF.
  anleitung:
    runs-on: ubuntu-24.04
    if: github.event_name != 'push'   # auf main nach dem Merge schon im PR geprüft, gebraucht nur für Windows
    steps:
      - uses: actions/checkout@v4
      - name: Python-Pakete
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pip libegl1 libxkbcommon0 poppler-utils
          /usr/bin/python3 -m pip install --break-system-packages -r requirements.txt -r programm/requirements.txt
      - name: Bedienungsanleitung erzeugen (Verweise, Bildschirmfotos, alle Fotos verwendet)
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/bin/python3 anleitung/erzeuge_anleitung.py --ziel Bedienungsanleitung.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: Bedienungsanleitung
          path: Bedienungsanleitung.pdf
          retention-days: 30

  windows:
    runs-on: windows-latest
    needs: [tests, anleitung]
    if: github.event_name == 'workflow_dispatch'   # Windows-Minuten zählen doppelt: nur von Hand (Sammel-Release)
    # Veröffentlichungen auf main nacheinander, damit Dateiliste und Pakete zusammenpassen
    concurrency:
      group: paket-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      RL_STAND: ${{ github.run_number }}     # Stand des Online-Updates, auch 4. Stelle der Dateiversion
      # Online-Update aus einem öffentlichen Repository (dieses ist privat, Release-Dateien ohne Anmeldung 404);
      # muss zu UPDATE_REPO in programm/rohrlaser/update.py passen. Schreibzugriff über das Secret UPDATES_TOKEN.
      UPDATE_REPO: patrickbrundiers-dev/Rohrlaser-Updates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Pakete
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r programm/requirements.txt
      - name: PyInstaller mit selbst übersetztem Startprogramm (Bootloader)
        # Der fertige Bootloader von PyInstaller steckt auch in Schadsoftware, darum schlagen Virenscanner bei ihm
        # oft Alarm. Ein selbst übersetzter Bootloader hat eine eigene Signatur und fällt viel seltener auf.
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip install --no-binary pyinstaller --no-cache-dir pyinstaller
          python -c "import PyInstaller, os; b = os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel'); print(os.listdir(b))"
      - name: STEP-Import.exe bauen
        run: pyinstaller --noconfirm --clean programm/step_messung/step_messung.spec
      - name: STEP-Import.exe gegen Python-Messung prüfen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "pruef ordner" | Out-Null
          Copy-Item tests/step/*.step "pruef ordner/"
          Copy-Item tests/step/T01_RR42-4x2_L1250.step "pruef ordner/Halter_äöü_Ø.step"
          python programm/step_messung/step_messen.py --ausgabe referenz.txt --netze netze_py "pruef ordner"
          Set-Content -Encoding utf8 liste.txt ((Get-ChildItem "pruef ordner" -Filter *.step | Sort-Object Name).FullName)
          # 8 Dateien: die .exe misst auf mehreren Prozessen (freeze_support) und schreibt die 3D-Netze
          & "dist/STEP-Import/STEP-Import.exe" --liste liste.txt --ausgabe exe.txt --netze netze_exe
          if ($LASTEXITCODE -ne 0) { throw "STEP-Import.exe Rückgabewert $LASTEXITCODE" }
          python tests/vergleiche_messung.py referenz.txt exe.txt
          $n = (Get-ChildItem netze_exe -Filter *.json).Count
          if ($n -ne (Get-ChildItem netze_py -Filter *.json).Count -or $n -lt 8) { throw "STEP-Import.exe: $n 3D-Netze" }
      - name: Rohrlaser-Angebotskalkulation.exe bauen
        run: pyinstaller --noconfirm --clean programm/rohrlaser.spec
      - name: Programm signieren (eigenes Zertifikat aus dem Secret SIGNATUR_PFX)
        # Selbst ausgestelltes Zertifikat „Patrick Brundiers“ (kostenlos). Windows vertraut ihm, sobald
        # Windows-Vertrauen-einrichten.cmd es eingetragen hat (ohne Adminrechte, je Benutzer). Fehlt das Secret,
        # bleibt alles unsigniert und der Build läuft trotzdem.
        # Secret einmalig auf dem eigenen PC erzeugen (PowerShell, keine Adminrechte), Inhalt der Zwischenablage als
        # Repository-Secret SIGNATUR_PFX speichern:
        #   $z = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Patrick Brundiers" -KeyLength 3072 `
        #        -NotAfter (Get-Date).AddYears(10) -CertStoreLocation Cert:\CurrentUser\My
        #   $d = "$env:TEMP\signatur.pfx"
        #   Export-PfxCertificate -Cert $z -FilePath $d -Password (ConvertTo-SecureString rohrlaser-signatur -AsPlainText -Force)
        #   [Convert]::ToBase64String([IO.File]::ReadAllBytes($d)) | Set-Clipboard; Remove-Item $d, $z.PSPath
        shell: pwsh
        env:
          SIGNATUR_PFX: ${{ secrets.SIGNATUR_PFX }}
        run: |
          # Windows-Vertrauen-einrichten.cmd bekommt den öffentlichen Teil des Zertifikats (ohne Secret: nur Freigabe)
          $cmd = Get-Content -Raw programm/installer/Windows-Vertrauen-einrichten.cmd
          if (-not $env:SIGNATUR_PFX) {
            [IO.File]::WriteAllText("$PWD\Windows-Vertrauen-einrichten.cmd", $cmd, [Text.UTF8Encoding]::new($false))
            "::warning::Secret SIGNATUR_PFX fehlt: Programm und Setup bleiben unsigniert"
            exit 0
          }
          $pfx = "$env:RUNNER_TEMP\signatur.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNATUR_PFX))
          # Kennwort wie beim Erzeugen festgelegt; es schützt nichts, geheim ist das Secret selbst
          $z = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, "rohrlaser-signatur")
          "Zertifikat: $($z.Subject), $($z.Thumbprint), gültig bis $($z.NotAfter)"
          if (-not $z.HasPrivateKey) { throw "SIGNATUR_PFX ohne privaten Schlüssel" }
          $oeffentlich = [Convert]::ToBase64String($z.Export("Cert"))
          [IO.File]::WriteAllText("$PWD\Windows-Vertrauen-einrichten.cmd", $cmd.Replace("@ZERTIFIKAT@", $oeffentlich),
                                  [Text.UTF8Encoding]::new($false))
          "SIGNATUR_FP=$($z.Thumbprint)" >> $env:GITHUB_ENV
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -like "*\x64\*" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe nicht gefunden" }
          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "SIGNATUR_DATEI=$pfx" >> $env:GITHUB_ENV
          $dateien = @("dist/STEP-Import/STEP-Import.exe", "dist/Rohrlaser-Angebotskalkulation/Rohrlaser-Angebotskalkulation.exe")
          # Zeitstempel: die Signatur bleibt auch nach Ablauf des Zertifikats gültig; Zeitstempeldienst notfalls erneut
          for ($i = 1; $i -le 3; $i++) {
            & $signtool sign /f $pfx /p rohrlaser-signatur /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "Rohrlaser Angebotskalkulation" @dateien
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds (10 * $i)
          }
          if ($LASTEXITCODE -ne 0) { throw "signtool Rückgabewert $LASTEXITCODE" }
          "SIGNIERT=1" >> $env:GITHUB_ENV
      - name: Versionsangaben der .exe prüfen (Hersteller, Produkt, Version)
        shell: pwsh
        run: |
          foreach ($exe in @("dist/STEP-Import/STEP-Import.exe",
                             "dist/Rohrlaser-Angebotskalkulation/Rohrlaser-Angebotskalkulation.exe")) {
            $v = (Get-Item $exe).VersionInfo
            "{0}: {1} / {2} / {3}" -f $exe, $v.CompanyName, $v.ProductName, $v.FileVersion
            if (-not $v.CompanyName -or -not $v.ProductName -or -not $v.FileVersion) { throw "$exe ohne Versionsangaben" }
          }
      - uses: actions/download-artifact@v4
        with:
          name: Bedienungsanleitung
      - name: Rohrlaser-Angebotskalkulation.exe Selbsttest (Beispielangebot, Optimierung, Ausgaben, STEP-Import)
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/STEP-Import dist/Rohrlaser-Angebotskalkulation/STEP-Import
          Copy-Item Bedienungsanleitung.pdf dist/Rohrlaser-Angebotskalkulation/
          Copy-Item Windows-Vertrauen-einrichten.cmd dist/Rohrlaser-Angebotskalkulation/
          $step = (Get-ChildItem tests/step/*.step | ForEach-Object { '"' + $_.FullName + '"' })
          $p = Start-Process -Wait -PassThru -FilePath "dist/Rohrlaser-Angebotskalkulation/Rohrlaser-Angebotskalkulation.exe" `
            -ArgumentList (@("--selbsttest", "--ergebnis", "selbsttest.txt", "--step") + $step)
          Get-Content -Encoding utf8 selbsttest.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest Rückgabewert $($p.ExitCode)" }
      - name: Update-Dateien erzeugen (Dateiliste Update.json mit Prüfsummen, Pakete)
        run: >
          python programm/update_paket.py --programm dist/Rohrlaser-Angebotskalkulation --ziel update_dateien
          --stand ${{ github.run_number }} --commit ${{ github.sha }} --in-programm
          --adresse "https://github.com/${{ env.UPDATE_REPO }}/releases/download/update-dateien/"
      - name: Online-Update testen (laufendes Programm tauscht alle eigenen Dateien aus, startet danach)
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/Rohrlaser-Angebotskalkulation update_alt
          python tests/update_windows.py vorbereiten update_alt
          $p = Start-Process -Wait -PassThru -FilePath "update_alt/Rohrlaser-Angebotskalkulation.exe" `
            -ArgumentList @("--update-test", "`"$PWD/update_dateien/Update.json`"", "--alle", "--ergebnis", "update.txt")
          Get-Content -Encoding utf8 update.txt
          if ($p.ExitCode -ne 0) { throw "Update-Test Rückgabewert $($p.ExitCode)" }
          $p = Start-Process -Wait -PassThru -FilePath "update_alt/Rohrlaser-Angebotskalkulation.exe" `
            -ArgumentList @("--selbsttest", "--ergebnis", "selbsttest_update.txt")
          Get-Content -Encoding utf8 selbsttest_update.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest nach dem Update Rückgabewert $($p.ExitCode)" }
          python tests/update_windows.py pruefen update_alt update_dateien/Update.json
          if ($LASTEXITCODE -ne 0) { throw "Update-Prüfung fehlgeschlagen" }
      - name: Installationsprogramm bauen (Inno Setup, nur für den Benutzer, dieselben Dateien wie das ZIP)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup lässt sich nicht installieren" }
          }
          $v = python -c "import sys; sys.path.insert(0, 'programm'); from versionsinfo import version; print(version())"
          $signieren = @()
          if ($env:SIGNIERT) {          # Setup und Uninstaller mit demselben Zertifikat ($f = Datei, $q = Anführungszeichen)
            $signieren = @("/DSignieren", "/Ssignieren=`$q$env:SIGNTOOL`$q sign /f `$q$env:SIGNATUR_DATEI`$q /p rohrlaser-signatur /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d `$qRohrlaser Angebotskalkulation Setup`$q `$f")
          }
          & $iscc "/DVersion=$v.${{ github.run_number }}" "/DQuelle=$PWD\dist\Rohrlaser-Angebotskalkulation" "/DAusgabe=$PWD" @signieren programm\installer\rohrlaser.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC Rückgabewert $LASTEXITCODE" }
          "{0:N0} MB" -f ((Get-Item Rohrlaser-Angebotskalkulation-Setup.exe).Length / 1MB)
      - name: Installation und portable Version testen (Datenort, gleiche Dateien und Ergebnisse, Deinstallation behält Daten)
        shell: pwsh
        run: |
          function Starten($datei, $argumente) {
            $p = Start-Process -Wait -PassThru -FilePath $datei -ArgumentList $argumente
            if ($p.ExitCode -ne 0) { throw "$datei $argumente Rückgabewert $($p.ExitCode)" }
          }
          function Pruefen {
            python tests/installer_windows.py @args
            if ($LASTEXITCODE -ne 0) { throw "Prüfung $($args[0]) fehlgeschlagen" }
          }
          function Warten($datei) {       # der Uninstaller arbeitet als Kopie weiter und löscht sich zuletzt
            for ($i = 0; $i -lt 120 -and (Test-Path $datei); $i++) { Start-Sleep -Seconds 1 }
            if (Test-Path $datei) { throw "$datei nach 2 Minuten noch da" }
          }
          $setup = "$PWD\Rohrlaser-Angebotskalkulation-Setup.exe"
          $still = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          $app = "$env:LOCALAPPDATA\Programs\Rohrlaser Angebotskalkulation"
          $daten = "$env:LOCALAPPDATA\Rohrlaser Angebotskalkulation\Daten"
          $exe = "$app\Rohrlaser-Angebotskalkulation.exe"
          # installieren (Pfad im Benutzerprofil, keine Adminrechte nötig), Dateien gleich dem ZIP
          Starten $setup ($still + "/LOG=$PWD\setup.log")
          Pruefen dateien $app update_dateien/Update.json
          Starten $exe @("--info", "--ergebnis", "$PWD\info_installiert.json")
          Pruefen info info_installiert.json installiert $daten 0
          Pruefen angebot "$daten\rohrlaser.db"
          Starten $exe @("--selbsttest", "--ergebnis", "$PWD\selbsttest_installiert.txt")
          # deinstallieren: Programm weg, Daten bleiben; neu installieren findet sie wieder
          Starten "$app\unins000.exe" $still
          Warten "$app\unins000.exe"
          Pruefen deinstalliert $app $daten
          Starten $setup $still
          Starten $exe @("--info", "--ergebnis", "$PWD\info_neu.json")
          Pruefen info info_neu.json installiert $daten 1
          # portabel: Portabel.ini neben der .exe, Daten im Ordner daneben, gleiche Rechenergebnisse
          Copy-Item -Recurse dist/Rohrlaser-Angebotskalkulation portabel_test
          Copy-Item programm/installer/Portabel.ini portabel_test/
          Starten "portabel_test\Rohrlaser-Angebotskalkulation.exe" @("--info", "--ergebnis", "$PWD\info_portabel.json")
          Pruefen info info_portabel.json portabel "$PWD\portabel_test\Daten" 0
          Starten "portabel_test\Rohrlaser-Angebotskalkulation.exe" @("--selbsttest", "--ergebnis", "$PWD\selbsttest_portabel.txt")
          Pruefen vergleichen selbsttest_installiert.txt selbsttest_portabel.txt
          # aufräumen, damit spätere Schritte nichts davon sehen
          Starten "$app\unins000.exe" $still
          Warten "$app\unins000.exe"
      - name: Windows-Vertrauen testen (Markierung „aus dem Internet“ weg, Zertifikat eingetragen, Signaturen gültig, entfernen)
        shell: pwsh
        run: |
          $t = (New-Item -ItemType Directory -Force vertrauen_test).FullName
          Copy-Item Windows-Vertrauen-einrichten.cmd, Rohrlaser-Angebotskalkulation-Setup.exe $t
          $setup = "$t\Rohrlaser-Angebotskalkulation-Setup.exe"
          Set-Content -LiteralPath $setup -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          if ((Get-Content -Raw -LiteralPath "$t\Windows-Vertrauen-einrichten.cmd") -notmatch "\r\n") { throw ".cmd ohne CRLF" }
          & "$t\Windows-Vertrauen-einrichten.cmd" /still
          if ($LASTEXITCODE -ne 0) { throw "Einrichten Rückgabewert $LASTEXITCODE" }
          if (Get-Item -LiteralPath $setup -Stream Zone.Identifier -ErrorAction SilentlyContinue) { throw "Markierung noch da" }
          $fp = $env:SIGNATUR_FP
          if ($env:SIGNIERT) {
            # Der Build läuft mit Adminrechten, darum trägt die Datei für den ganzen PC ein (beim Benutzer: CurrentUser)
            foreach ($n in @("Root", "TrustedPublisher")) {
              if (-not (Get-ChildItem "Cert:\LocalMachine\$n" | Where-Object Thumbprint -eq $fp)) { throw "Zertifikat fehlt in $n" }
            }
            foreach ($d in @($setup, "dist/STEP-Import/STEP-Import.exe",
                             "dist/Rohrlaser-Angebotskalkulation/Rohrlaser-Angebotskalkulation.exe",
                             "dist/Rohrlaser-Angebotskalkulation/STEP-Import/STEP-Import.exe")) {
              $s = Get-AuthenticodeSignature -LiteralPath $d
              "{0}: {1}, {2}, Zeitstempel {3}" -f $d, $s.Status, $s.SignerCertificate.Subject, [bool]$s.TimeStamperCertificate
              if ($s.Status -ne "Valid" -or $s.SignerCertificate.Thumbprint -ne $fp) { throw "$d nicht gültig signiert" }
            }
          }
          & "$t\Windows-Vertrauen-einrichten.cmd" entfernen /still
          if ($LASTEXITCODE -ne 0) { throw "Entfernen Rückgabewert $LASTEXITCODE" }
          if ($fp -and (Get-ChildItem Cert:\LocalMachine\Root | Where-Object Thumbprint -eq $fp)) { throw "Zertifikat nicht entfernt" }
      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          # Portabel.ini macht das ZIP portabel (Daten neben dem Programm); das Installationsprogramm hat sie nicht
          Copy-Item programm/installer/Portabel.ini dist/Rohrlaser-Angebotskalkulation/
          Compress-Archive -Path dist/Rohrlaser-Angebotskalkulation -DestinationPath Rohrlaser-Angebotskalkulation.zip
          "{0:N0} MB" -f ((Get-Item Rohrlaser-Angebotskalkulation.zip).Length / 1MB)
          # Prüfsumme: damit lässt sich nachprüfen, dass das ZIP unverändert von GitHub kommt
          $h = (Get-FileHash -Algorithm SHA256 Rohrlaser-Angebotskalkulation.zip).Hash
          "$h  Rohrlaser-Angebotskalkulation.zip" | Set-Content -Encoding ascii Rohrlaser-Angebotskalkulation.zip.sha256
          Get-Content Rohrlaser-Angebotskalkulation.zip.sha256
          $h = (Get-FileHash -Algorithm SHA256 Rohrlaser-Angebotskalkulation-Setup.exe).Hash
          "$h  Rohrlaser-Angebotskalkulation-Setup.exe" | Set-Content -Encoding ascii Rohrlaser-Angebotskalkulation-Setup.exe.sha256
          Get-Content Rohrlaser-Angebotskalkulation-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        continue-on-error: true      # volles Artefakt-Kontingent darf den Build nicht scheitern lassen
        with:
          name: Rohrlaser-Angebotskalkulation
          path: dist/Rohrlaser-Angebotskalkulation/
          retention-days: 3           # rund 500 MB; das fertige Paket liegt ohnehin im Release
      - name: Alte Pakete aus dem Release "aktuell" entfernen (Excel-Mappe, altes Programm-ZIP)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($datei in @("Rohrlaser-Kalkulation.zip", "Rohrlaser-Programm.zip")) {
            gh release delete-asset aktuell $datei --yes --repo "${{ github.repository }}" 2>$null
          }
          $global:LASTEXITCODE = 0
      - name: Release "aktuell" aktualisieren
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aktuell
          name: Rohrlaser Angebotskalkulation (aktueller Stand)
          body: |
            Stand ${{ github.run_number }} (${{ github.sha }}).
            Rohrlaser-Angebotskalkulation-Setup.exe: Installation für den angemeldeten Benutzer (keine Adminrechte),
            mit Startmenü und Desktop-Verknüpfung. Die Daten liegen in %LOCALAPPDATA%\Rohrlaser Angebotskalkulation\Daten
            und bleiben beim Deinstallieren erhalten.
            Rohrlaser-Angebotskalkulation.zip: dieselbe Version portabel ohne Installation (Angebote, STEP-Import,
            Optimierung, Staffelpreise, PDF, CSV-Export). Entpacken, Rohrlaser-Angebotskalkulation.exe starten; die
            Daten liegen im Ordner Daten neben dem Programm.
            Bedienungsanleitung.pdf liegt im Programmordner (auch im Programm unter Hilfe, F1).
            Umziehen zwischen beiden: Datei → Daten exportieren … / Daten importieren …
            Vor dem ersten Start bzw. Entpacken: Rechtsklick auf Setup.exe bzw. ZIP → Eigenschaften → „Zulassen“ → OK.
            Dann warnt Windows nicht und prüft beim Entpacken nicht jede Datei einzeln. Windows-Vertrauen-einrichten.cmd
            (in denselben Ordner laden, Doppelklick, keine Adminrechte) erledigt das und trägt das Zertifikat ein, mit dem
            Programm und Setup signiert sind. Mehr in der Bedienungsanleitung, Abschnitt „Windows-Warnungen“.
            SHA256-Prüfsummen: Rohrlaser-Angebotskalkulation.zip.sha256, Rohrlaser-Angebotskalkulation-Setup.exe.sha256
            Online-Update (Hilfe → Nach Updates suchen): ab Version 0.5.5 holt das Programm Dateiliste und Pakete ohne
            Anmeldung aus dem öffentlichen Repository Rohrlaser-Updates und lädt nur geänderte Dateien. Ältere
            Versionen einmal mit diesem Setup bzw. ZIP ersetzen.
          files: |
            Rohrlaser-Angebotskalkulation-Setup.exe
            Rohrlaser-Angebotskalkulation-Setup.exe.sha256
            Rohrlaser-Angebotskalkulation.zip
            Rohrlaser-Angebotskalkulation.zip.sha256
            update_dateien/Update.json
            Bedienungsanleitung.pdf
            Windows-Vertrauen-einrichten.cmd
          make_latest: true
      - name: Update-Pakete hochladen (Repository Rohrlaser-Updates, Release "update-dateien", nur neue Pakete)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw ("Secret UPDATES_TOKEN fehlt: Fine-grained Token mit Contents Read and write für $env:UPDATE_REPO " +
                   "anlegen und unter Settings → Secrets and variables → Actions als UPDATES_TOKEN eintragen.")
          }
          $repo = $env:UPDATE_REPO
          # Ein leeres Repository hat keinen Commit, daran lässt sich kein Release hängen: README anlegen
          gh api "repos/$repo/contents/README.md" *> $null
          if ($LASTEXITCODE -ne 0) {
            $text = "# Rohrlaser-Updates`n`nDateien für das Online-Update der Rohrlaser Angebotskalkulation " +
                    "(Hilfe → Nach Updates suchen). Nicht von Hand herunterladen.`n"
            $inhalt = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
            gh api -X PUT "repos/$repo/contents/README.md" -f message="README für die Update-Releases" -f content=$inhalt
            if ($LASTEXITCODE -ne 0) { throw "README in $repo lässt sich nicht anlegen (Token-Rechte prüfen)" }
          }
          gh release view update-dateien --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create update-dateien --repo $repo --latest `
              --title "Update-Dateien (für Hilfe → Nach Updates suchen)" `
              --notes "Dateiliste Update.json und Pakete für das Online-Update der Rohrlaser Angebotskalkulation. Nicht von Hand herunterladen."
            if ($LASTEXITCODE -ne 0) { throw "Release update-dateien lässt sich nicht anlegen" }
          }
          $id = gh api "repos/$repo/releases/tags/update-dateien" --jq ".id"
          $vorhanden = @(gh api --paginate "repos/$repo/releases/$id/assets?per_page=100" --jq ".[].name")
          $neu = @(Get-ChildItem update_dateien -Filter *.zip | Where-Object { $vorhanden -notcontains $_.Name })
          "{0} Pakete schon vorhanden, {1} neu ({2:N1} MB)" -f $vorhanden.Count, $neu.Count, (($neu | Measure-Object Length -Sum).Sum / 1MB)
          foreach ($datei in $neu) {
            gh release upload update-dateien $datei.FullName --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Hochladen von $($datei.Name) fehlgeschlagen" }
          }
          # bisherige Dateiliste merken: ihre Pakete bleiben einen Stand länger liegen (siehe nächster Schritt)
          gh release download update-dateien -p Update.json -O update_vorher.json --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { "{}" | Set-Content update_vorher.json; $global:LASTEXITCODE = 0 }
          # Dateiliste erst, wenn alle ihre Pakete da sind
          gh release upload update-dateien update_dateien/Update.json --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Hochladen von Update.json fehlgeschlagen" }
          # anonym (wie das Programm) prüfen, dass die Dateiliste ankommt
          $url = "https://github.com/$repo/releases/download/update-dateien/Update.json"
          for ($i = 1; $i -le 6; $i++) {
            try { $stand = ([Text.Encoding]::UTF8.GetString((Invoke-WebRequest -UseBasicParsing $url).RawContentStream.ToArray()) | ConvertFrom-Json).stand }
            catch { $stand = "Fehler: $_" }
            if ("$stand" -eq "$env:RL_STAND") { break }
            "Versuch ${i}: Stand online $stand"
            Start-Sleep -Seconds 10
          }
          if ("$stand" -ne "$env:RL_STAND") { throw "$url liefert nicht Stand $env:RL_STAND" }
          "Update.json Stand $env:RL_STAND ohne Anmeldung abrufbar"
      - name: Nicht mehr gebrauchte Update-Pakete löschen
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
        run: |
          $repo = $env:UPDATE_REPO
          # Pakete des neuen und des vorigen Stands bleiben: ein Programm, das die vorige Dateiliste schon geholt hat,
          # findet seine Pakete noch (und holt sonst die neue Liste, update.neuere_liste)
          $gebraucht = @("Update.json")
          foreach ($liste in @("update_dateien/Update.json", "update_vorher.json")) {
            $pakete = (Get-Content -Raw -Encoding utf8 $liste | ConvertFrom-Json).pakete
            if ($pakete) { $gebraucht += @($pakete.PSObject.Properties.Name) }
          }
          $id = gh api "repos/$repo/releases/tags/update-dateien" --jq ".id"
          foreach ($name in @(gh api --paginate "repos/$repo/releases/$id/assets?per_page=100" --jq ".[].name")) {
            if ($gebraucht -notcontains $name) { gh release delete-asset update-dateien $name --yes --repo $repo }
          }
          $global:LASTEXITCODE = 0
