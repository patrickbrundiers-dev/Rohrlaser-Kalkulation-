# Baut STEP-Import.exe (Windows, ohne Installation lauffähig), prüft sie gegen die Python-Messung
# und packt sie mit der Mappe zu Rohrlaser-Kalkulation.zip. Baut außerdem das eigenständige Programm
# Rohrlaser-Kalkulation.exe (Rohrlaser-Programm.zip). Auf main werden beide Pakete als
# Release "aktuell" veröffentlicht.
name: Paket

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: LibreOffice und Python-Pakete
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc python3-uno python3-pip libegl1 libxkbcommon0
          /usr/bin/python3 -m pip install --break-system-packages -r requirements.txt -r programm/requirements.txt
      - name: Python-Tests
        run: |
          /usr/bin/python3 tests/test_step_import.py
          /usr/bin/python3 tests/test_optimierung.py
          /usr/bin/python3 tests/test_layout.py
      - name: Programm-Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /usr/bin/python3 tests/test_programm.py
          /usr/bin/python3 tests/test_programm_mappe.py
          /usr/bin/python3 tests/test_programm_ausgabe.py
      - name: Abnahme (realistische Testaufträge, Kriterien und Vergleich mit der Mappe)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /usr/bin/python3 tests/test_abnahme.py --protokoll Abnahmeprotokoll.md
          cat Abnahmeprotokoll.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Abnahmeprotokoll
          path: Abnahmeprotokoll.md
          retention-days: 90
      - name: VBA-Tests (LibreOffice)
        run: /usr/bin/python3 tests/test_vba.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python-Pakete
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r programm/requirements.txt pyinstaller
      - name: STEP-Import.exe bauen
        run: pyinstaller --noconfirm --clean tools/step_import_exe.spec
      - name: STEP-Import.exe gegen Python-Messung prüfen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "pruef ordner" | Out-Null
          Copy-Item tests/step/*.step "pruef ordner/"
          Copy-Item tests/step/T01_RR42-4x2_L1250.step "pruef ordner/Halter_äöü_Ø.step"
          python tools/step_messen.py --ausgabe referenz.txt "pruef ordner"
          Set-Content -Encoding utf8 liste.txt ((Get-ChildItem "pruef ordner" -Filter *.step | Sort-Object Name).FullName)
          & "dist/STEP-Import/STEP-Import.exe" --liste liste.txt --ausgabe exe.txt
          if ($LASTEXITCODE -ne 0) { throw "STEP-Import.exe Rückgabewert $LASTEXITCODE" }
          python tests/vergleiche_messung.py referenz.txt exe.txt
      - name: Rohrlaser-Kalkulation.exe bauen
        run: pyinstaller --noconfirm --clean programm/rohrlaser.spec
      - name: Rohrlaser-Kalkulation.exe Selbsttest (mit Auftrag, Optimierung und STEP-Import)
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/STEP-Import dist/Rohrlaser-Kalkulation/STEP-Import
          $step = (Get-ChildItem tests/step/*.step | ForEach-Object { '"' + $_.FullName + '"' })
          $p = Start-Process -Wait -PassThru -FilePath "dist/Rohrlaser-Kalkulation/Rohrlaser-Kalkulation.exe" `
            -ArgumentList (@("--selbsttest", "--mappe", "mappe/Rohrlaser_Kalkulation_v02.xlsm", "--ergebnis", "selbsttest.txt", "--step") + $step)
          Get-Content -Encoding utf8 selbsttest.txt
          if ($p.ExitCode -ne 0) { throw "Selbsttest Rückgabewert $($p.ExitCode)" }
      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory paket | Out-Null
          Copy-Item mappe/Rohrlaser_Kalkulation_v02.xlsm paket/
          Copy-Item -Recurse dist/STEP-Import paket/STEP-Import
          Compress-Archive -Path paket/* -DestinationPath Rohrlaser-Kalkulation.zip
          "{0:N0} MB" -f ((Get-Item Rohrlaser-Kalkulation.zip).Length / 1MB)
          Compress-Archive -Path dist/Rohrlaser-Kalkulation -DestinationPath Rohrlaser-Programm.zip
          "{0:N0} MB" -f ((Get-Item Rohrlaser-Programm.zip).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: Rohrlaser-Kalkulation
          path: paket/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Rohrlaser-Programm
          path: dist/Rohrlaser-Kalkulation/
          retention-days: 30
      - name: Release "aktuell" aktualisieren
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aktuell
          name: Rohrlaser-Kalkulation (aktueller Stand)
          body: |
            Stand ${{ github.sha }}.
            Rohrlaser-Kalkulation.zip: Mappe und STEP-Import.exe. Entpacken, Rohrlaser_Kalkulation_v02.xlsm öffnen
            und Makros aktivieren. Der Ordner STEP-Import muss neben der Mappe liegen.
            Rohrlaser-Programm.zip: eigenständiges Programm (Aufträge, STEP-Import, Optimierung, Staffelpreise, PDF, Excel-Export). Entpacken,
            Rohrlaser-Kalkulation.exe starten.
            Die Daten liegen im Ordner Daten neben dem Programm.
          files: |
            Rohrlaser-Kalkulation.zip
            Rohrlaser-Programm.zip
          make_latest: true
