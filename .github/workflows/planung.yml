# Maschinenplanung (Ordner planung/): Tests unter Linux bei jedem Pull Request und Push auf main. Von Hand gestartet
# (Actions > Planung > Run workflow) baut der Windows-Teil die portable Rohrlaser-Maschinenplanung.zip (eine .exe ohne
# Installation und ohne Admin-Rechte), prüft sie mit --selbsttest und legt sie als Artefakt ab (kein Release).
name: Planung

on:
  push:
    branches: [main]
    paths: ["planung/**", "tests/test_planung_*.py", ".github/workflows/planung.yml"]
  pull_request:
    paths: ["planung/**", "tests/test_planung_*.py", ".github/workflows/planung.yml"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tests (nur Standardbibliothek)
        run: |
          python3 tests/test_planung_kalender.py
          python3 tests/test_planung_server.py
          python3 -m planung --selbsttest

  windows:
    runs-on: windows-latest
    needs: tests
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyInstaller mit selbst übersetztem Startprogramm (Bootloader, wie beim Kalkulationsprogramm)
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --upgrade pip
          pip install --no-binary pyinstaller --no-cache-dir pyinstaller
      - name: Tests unter Windows
        run: |
          python tests/test_planung_kalender.py
          python tests/test_planung_server.py
      - name: Rohrlaser-Maschinenplanung.exe bauen
        run: pyinstaller --noconfirm --clean --onedir --name Rohrlaser-Maschinenplanung --paths . --add-data "planung/web;planung/web" planung/start.py
      - name: Selbsttest der fertigen .exe
        run: dist/Rohrlaser-Maschinenplanung/Rohrlaser-Maschinenplanung.exe --selbsttest
      - name: ZIP packen
        shell: pwsh
        run: |
          Copy-Item planung/paket/*.cmd dist/Rohrlaser-Maschinenplanung/
          Copy-Item planung/README.md dist/Rohrlaser-Maschinenplanung/LIESMICH.md
          Compress-Archive -Path dist/Rohrlaser-Maschinenplanung -DestinationPath Rohrlaser-Maschinenplanung.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Rohrlaser-Maschinenplanung
          path: Rohrlaser-Maschinenplanung.zip
          retention-days: 30
