# Baut das eigene Programm Rohrlaser-Auslastung.exe (programm/rl_auslastung, läuft ohne die Kalkulation) als ZIP.
# Nur von Hand (Actions > Auslastung > Run workflow), weil Windows-Minuten doppelt zählen. Das ZIP liegt danach als
# Artefakt am Lauf (angemeldet herunterladen); es wird nichts veröffentlicht. Die fertige .exe wird mit dem
# Selbsttest geprüft (Auftrag anlegen, einlasten, fertig melden, PDF).
# Dieses ZIP ist ein Probestand ohne Signatur. Das Sammel-Release (paket.yml) baut dasselbe Programm signiert und
# legt Rohrlaser-Auslastung.zip in das Release "aktuell".
name: Auslastung

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Python-Pakete
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials==6.12.0 pyinstaller==6.22.3
      - name: Tests des Programms
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_rl_auslastung.py
      - name: Rohrlaser-Auslastung.exe bauen
        run: pyinstaller --noconfirm --clean programm/auslastung.spec
      - name: Selbsttest der fertigen .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Rohrlaser-Auslastung\Rohrlaser-Auslastung.exe" -ArgumentList "--selbsttest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen: $($p.ExitCode)" }
      - name: ZIP packen
        shell: pwsh
        run: Compress-Archive -Path "dist\Rohrlaser-Auslastung" -DestinationPath "Rohrlaser-Auslastung.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Rohrlaser-Auslastung
          path: Rohrlaser-Auslastung.zip
