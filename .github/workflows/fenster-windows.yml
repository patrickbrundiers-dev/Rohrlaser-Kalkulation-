# Fensterprobe unter echtem Windows (Auftrag Patrick 27.11.2026: „X in jedem Fenster ausgegraut/ohne Funktion“,
# Fensterstabilität). Klein und nur bei Änderungen an der Fensterverwaltung: ein Windows-Rechner, nur PySide6,
# einige Minuten. Kein Pflicht-Check für das Mergen. Ergebnis in der Zusammenfassung, Bildschirmfotos als Artefakt.
name: Fenster Windows

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "programm/rohrlaser/fenster_merken.py"
      - "programm/rohrlaser/fenster_platz.py"
      - "programm/rohrlaser/geister.py"
      - "programm/rohrlaser/fenster_wache.py"
      - "tests/windows_fenster.py"
      - ".github/workflows/fenster-windows.yml"

concurrency:
  group: fenster-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PySide6
        run: python -m pip install PySide6-Essentials==6.12.0
      - name: Fensterprobe
        run: python tests/windows_fenster.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fenster-windows
          path: fenster_windows/
          retention-days: 7
